services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    image: ragmodels/ollama:latest
    container_name: ollama_container
    volumes:
      - ./ollama_models:/root/.ollama/models
      - ./scripts:/app/scripts
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_DEBUG=0
      - MODEL_NAME=${MODEL_NAME:-qwen3:8b}
      #- EMBD_MODEL_NAME=${EMBD_MODEL_NAME:-dengcao/Qwen3-Embedding-0.6B:Q8_0}
      - EMBD_MODEL_NAME=${EMBD_MODEL_NAME:-dengcao/Qwen3-Embedding-4B:Q4_K_M}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "11434:11434"

  llama_cpp:
    build:
      context: .
      dockerfile: Dockerfile.llamacpp
      #platform: linux/amd64
    image: reranker/llamacpp
    container_name: llama_cpp_container
    volumes:
      - ./models:/app/models 
    environment:
      - MODEL_NAME="/app/models/Qwen3-Reranker-0.6B-q4_k_m.gguf"
      - MODEL_DOWNLOAD_LINK=https://huggingface.co/Mungert/Qwen3-Reranker-0.6B-GGUF/resolve/main/Qwen3-Reranker-0.6B-q4_k_m.gguf
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "10000:10000"

  data_processing:
    build:
      context: .
      dockerfile: Dockerfile.rag
    image: ragchatbot:light 
    container_name: process_data_container
    volumes:
      - './data:/app/data'
      - ./.chroma_db:/app/.chroma_db
      - './:/app'
    depends_on:
      - ollama
    command: python process_data.py --source whatsapp --data_dir_path data --embed_model dengcao/Qwen3-Embedding-0.6B:Q8_0
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434

  chatbot:
    # build:
    #   context: .
    #   dockerfile: Dockerfile.rag
    image: ragchatbot:light 
    container_name: rag_chatbot_container
    ports:
      - "8000:8000"
    volumes:
      - ./.chroma_db:/app/.chroma_db
      - ./:/app
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLAMACPP_BASE_URL=http://llama_cpp:10000
    depends_on:
      - ollama
      - data_processing
      - llama_cpp
    tty: true
    command: python app.py
